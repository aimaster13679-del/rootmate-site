#nm-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#F7F8F5;transition:opacity .22s ease,visibility .22s}
html.nm-dk #nm-splash{background:#0A0C0B}
#nm-splash.out{opacity:0;visibility:hidden}
#nm-splash .sw{display:grid;justify-items:center;gap:18px}
#nm-splash .sq{position:relative;width:112px;height:112px;border-radius:30px;background:radial-gradient(90px 90px at 50% 38%,#1F6B52,#10251C 60%,#0A0C0B);box-shadow:0 24px 50px -22px rgba(30,140,100,.65),inset 0 0 0 1px rgba(255,255,255,.08);animation:nmSq .42s cubic-bezier(.2,.9,.3,1.2) both}
#nm-splash .gl{position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(closest-side,rgba(120,228,186,.38),transparent);animation:nmGl 2.4s ease-in-out .5s infinite;pointer-events:none}
#nm-splash svg{position:absolute;inset:0;width:100%;height:100%}
#nm-splash path{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
#nm-splash .h1{stroke:#fff;animation:nmDraw .62s ease-out .16s forwards}
#nm-splash .h2{stroke:url(#nmGold);animation:nmDraw .62s ease-out .34s forwards}
#nm-splash .hs{transform-origin:60px 60px;animation:nmBeat 1.1s ease-in-out 1.05s infinite}
#nm-splash .wm{font:600 22px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#10251C;opacity:0;animation:nmUp .4s ease-out .55s forwards}
html.nm-dk #nm-splash .wm{color:#EEF7F1}
@keyframes nmSq{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}
@keyframes nmDraw{to{stroke-dashoffset:0}}
@keyframes nmBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.06)}36%{transform:scale(1)}}
@keyframes nmGl{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@keyframes nmUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#nm-splash *{animation:none!important}#nm-splash path{stroke-dashoffset:0}#nm-splash .wm{opacity:1}}
</style>
