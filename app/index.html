<style id="nm-splash-css">
#nm-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#FFF8F6;transition:opacity .25s ease,visibility .25s}
html.nm-dk #nm-splash{background:#0A0A0D}
#nm-splash.out{opacity:0;visibility:hidden}
#nm-splash .sw{display:grid;justify-items:center;gap:22px}
#nm-splash .mk{position:relative;width:176px;height:113px;animation:nmIn .7s cubic-bezier(.2,.9,.3,1.15) both}
#nm-splash .mk img{position:relative;width:100%;height:100%;display:block}
#nm-splash .gl{position:absolute;inset:-46px -40px;border-radius:50%;background:radial-gradient(closest-side,rgba(232,140,150,.30),transparent);animation:nmGl 2.4s ease-in-out .7s infinite;pointer-events:none}
#nm-splash .sh{position:absolute;inset:0;-webkit-mask:url(img/nm-mark.png) center/contain no-repeat;mask:url(img/nm-mark.png) center/contain no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%) -180px 0/180% 100% no-repeat;animation:nmSh 1.6s ease-in-out .55s infinite}
#nm-splash .ld{width:64px;height:4px;border-radius:9px;background:rgba(150,52,88,.14);overflow:hidden;position:relative;opacity:0;animation:nmUp .4s ease-out .6s forwards}
#nm-splash .ld i{position:absolute;top:0;bottom:0;width:40%;border-radius:9px;background:linear-gradient(90deg,#E8A39A,#C8607A);animation:nmLd 1.1s ease-in-out .6s infinite}
html.nm-dk #nm-splash .ld{background:rgba(255,255,255,.12)}
@keyframes nmIn{from{transform:translateY(10px) scale(.86);opacity:0}to{transform:none;opacity:1}}
@keyframes nmGl{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.05)}}
@keyframes nmSh{0%{background-position:-180px 0}60%,100%{background-position:240px 0}}
@keyframes nmLd{0%{left:-40%}100%{left:100%}}
@keyframes nmUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#nm-splash *{animation:none!important}#nm-splash .ld{opacity:1}}
</style>

<div id="nm-splash" aria-hidden="true"><div class="sw"><div class="mk"><span class="gl"></span><img id="nm-smk" src="img/nm-mark.png" alt=""><span class="sh"></span></div><div class="ld"><i></i></div></div></div>
<script>/* opening animation (his ask 7 Nov 12:53): theme first, then the app removes it once the first screen is drawn */(function(){var d=document.documentElement,lt=true;try{var t=localStorage.getItem('nm.glassmode');lt=t?t==='light':!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){}if(!lt){d.classList.add('nm-dk');var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content','#0A0C0B')}
var t0=Date.now(),done=false;window.nmSplashDone=function(){if(done)return;done=true;var w=Math.max(0,750-(Date.now()-t0));setTimeout(function(){var e=document.getElementById('nm-splash');if(!e)return;e.classList.add('out');setTimeout(function(){e.remove()},260)},w)};setTimeout(window.nmSplashDone,6000)})();</script>
